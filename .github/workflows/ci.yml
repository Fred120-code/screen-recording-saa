name: CI and Docker delivery

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: snapcast-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24"

jobs:
  validate:
    name: Lint, typecheck, build and smoke test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: Build Next.js
        run: npm run build
        env:
          # Build-only values; do not expose production credentials during compilation.
          DATABASE_URL_POSTGRES: postgresql://build:build@127.0.0.1:5432/build_placeholder
          NEXT_PUBLIC_BASE_URL: http://localhost:3000
          GOOGLE_CLIENT_ID: build-placeholder
          GOOGLE_CLIENT_SECRET: build-placeholder
          BETTER_AUTH_SECRET: build-only-placeholder-secret-please-replace-at-runtime
          BETTER_AUTH_URL: http://localhost:3000
          NEXT_TELEMETRY_DISABLED: "1"

  publish-image:
    name: Build, scan and publish Docker image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build local image (do not push yet)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/Dockerfile
          push: false
          load: true
          tags: snapcast:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      
      - name: Diagnose vulnerable bundled packages
        run: |
          docker run --rm --entrypoint node snapcast:ci -e '
          const fs = require("fs");
          const paths = [
            "/app/node_modules/next/dist/compiled/brace-expansion/package.json",
            "/app/node_modules/next/dist/compiled/undici/package.json",
            "/app/node_modules/brace-expansion/package.json",
            "/app/node_modules/undici/package.json"
          ];
          for (const path of paths) {
            if (fs.existsSync(path)) {
              const pkg = JSON.parse(fs.readFileSync(path, "utf8"));
              console.log(`${pkg.name}: ${pkg.version} (${path})`);
            }
          }
          '

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: snapcast:ci
          format: table
          vuln-type: os,library
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Tag and push verified image
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          IMAGE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ -z "$DOCKERHUB_USERNAME" ]; then
            echo "Missing repository secret: DOCKERHUB_USERNAME"
            exit 1
          fi

          IMAGE="docker.io/$DOCKERHUB_USERNAME/snapcast"
          docker tag snapcast:ci "$IMAGE:sha-$IMAGE_SHA"
          docker tag snapcast:ci "$IMAGE:latest"
          docker push "$IMAGE:sha-$IMAGE_SHA"
          docker push "$IMAGE:latest"
